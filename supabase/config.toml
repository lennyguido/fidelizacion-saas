# Configuración de Supabase CLI (desarrollo local y CI).
# Los valores no indicados usan los defaults de la CLI.
project_id = "fidelizacion-saas"

[api]
enabled = true
port = 54321
# Esquemas expuestos por la API. Agregar cada módulo nuevo (loyalty, recovery, ...).
# En el proyecto remoto se configura igual en Project Settings → Data API → Exposed schemas.
schemas = ["public", "graphql_public", "core", "loyalty"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[auth.email]
enable_signup = true
enable_confirmations = false

# Edge Function de Google/Apple Wallet (docs/WALLET.md). Sin verificación de JWT: la
# tarjeta del cliente no tiene sesión y Apple llama directo; cada ruta se protege con el
# token de la tarjeta, el del pase (Apple) o WALLET_SYNC_SECRET.
[functions.wallet]
verify_jwt = false

[functions.sales-ingest]
verify_jwt = false
