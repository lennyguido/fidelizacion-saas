name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, format, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # Hasta que exista package-lock.json en la raíz se usa install; después, npm ci.
      - run: scripts/ci-run.sh install bash -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'
      - run: scripts/ci-run.sh typecheck npm run typecheck
      - run: scripts/ci-run.sh lint npm run lint
      - run: scripts/ci-run.sh format npm run format:check
      - run: scripts/ci-run.sh unit npm test
      - run: scripts/ci-run.sh build npm run build

  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Los errores se publican como anotaciones para poder leerlos desde la API de checks.
      - name: Start database (migrations + seed)
        run: |
          set -o pipefail
          supabase db start 2>&1 | tee db-start.txt || {
            msg="$(grep -iE 'error|failed|psql' db-start.txt | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=supabase db start::${msg}"
            exit 1
          }
      - name: Run pgTAP tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee test-output.txt || {
            msg="$(grep -E 'not ok|Failed|ERROR|Looks like|Dubious|psql:|Result|#' test-output.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=supabase test db::${msg}"
            exit 1
          }

  e2e:
    name: End-to-end (Supabase local + panel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: scripts/ci-run.sh install bash -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'
      - run: scripts/ci-run.sh "supabase start" supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime
      - name: Configure panel env from local Supabase
        run: |
          supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "VITE_CLIENT_APP_URL=http://localhost:4174"
          } > apps/admin/.env.local
      - run: scripts/ci-run.sh "build admin" npm run build -w @plataforma/admin
      - run: scripts/ci-run.sh "build client" npm run build -w @plataforma/client
      - run: npx playwright install --with-deps chromium
      - name: Serve panel
        run: |
          npm run preview -w @plataforma/admin -- --port 4173 --strictPort > preview.log 2>&1 &
          npm run preview -w @plataforma/client -- --port 4174 --strictPort > preview-client.log 2>&1 &
          npx --yes wait-on http://localhost:4173 http://localhost:4174 --timeout 60000
      - run: scripts/ci-run.sh e2e npx playwright test
