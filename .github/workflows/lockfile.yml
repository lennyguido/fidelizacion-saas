name: Lockfile

# El entorno del agente no puede descargar paquetes de npm. Cuando cambia algún
# package.json, este workflow actualiza package-lock.json y lo commitea.
# Como los commits del bot no disparan el CI, después hace falta un push más.
on:
  push:
    paths:
      - '**/package.json'
      - '.github/workflows/lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "lockfile up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update package-lock.json"
          git pull --rebase
          git push
